# Pushing a tag `v*` drafts a GitHub release for it, with generated notes,
# after checking that the committed dist/ matches the sources. Review and
# publish the draft on GitHub.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify dist/ matches the sources
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is out of date at this tag. Run 'npm run pack', commit, and re-tag."
            exit 1
          fi
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
